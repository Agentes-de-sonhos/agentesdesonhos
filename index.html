<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Favicons / touch icons (served from /public, no React required) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Agency domains: swap title + favicon before any script loads, so the
         platform brand never flashes on white-label sites. -->
    <script>
      (function () {
        var A = "/__l5e/assets-v1/";
        var C = { t: "Curti Viagens", i: A + "7db0ec28-c0cd-49f7-9898-12de4595f867/favicon-curti-viagens.png" };
        var D = { t: "Drica Viagens", i: A + "cdf056af-a8ac-4a8a-879f-0fe20f22be84/favicon-drica-viagens-2.png" };
        var B = { t: "Bardelli Viagens", i: A + "efd94c36-2c82-40de-ac03-9baf75171e97/favicon-bardelli-viagens.png" };
        var M = { t: "O Mundo em Cores", i: A + "856d7aa4-7a90-4ef4-bd57-bfc670d54200/favicon-o-mundo-em-cores.png" };
        var J = { t: "Destinos com a Ju", i: A + "0f524af6-1828-403c-aac6-b2289c25f513/favicon-destinos-com-a-ju.png" };
        var L = { t: "100 Limites Turismo", i: A + "ec1c2ef4-4ff4-4541-a04a-c12c5b7d32ec/favicon-100-limites-2.png" };
        var P = { t: "Paraiso Viagens", i: A + "9cfa9b87-08ac-4d14-b6e9-d25f436c9e62/favicon-paraiso-viagens.png" };
        var E = { t: "Essyatur", i: A + "a2cb34fe-0112-4620-8975-be199edff645/favicon-essya-tur.png" };
        var map = {
          "curtiviagens.com.br": C, "dricaviagens.com.br": D, "bardelliviagens.com.br": B,
          "omundoemcores.com.br": M, "destinoscomaju.com.br": J, "100limites.tur.br": L,
          "paraisoviagens.com": P, "essyatur.com.br": E
        };
        try {
          var h = location.hostname.toLowerCase();
          var q = new URLSearchParams(location.search).get("__agency_host");
          if (q) h = q.toLowerCase();
          var b = map[h.replace(/^www\./, "")];
          if (!b) return;
          document.title = b.t;
          var links = document.querySelectorAll('link[rel~="icon"]');
          for (var k = 0; k < links.length; k++) links[k].parentNode.removeChild(links[k]);
          var l = document.createElement("link");
          l.rel = "icon"; l.href = b.i;
          document.head.appendChild(l);
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#0f766e" />

    <!-- Neutral baseline shared across all domains — institutional site AND
         white-label public share subdomains (seuorcamento.tur.br,
         seuroteiro.tur.br, carteiradigital.tur.br, contato.tur.br,
         vitrine.tur.br, etc). Non-JS crawlers (WhatsApp, Facebook, LinkedIn)
         must NEVER see Agentes de Sonhos institutional branding on public
         share links. Institutional per-route metadata is applied via
         react-helmet-async on the main site routes (LandingPage). -->
    <title>O seu próximo destino começa aqui 🌍</title>
    <meta
      name="description"
      content="Tudo que você precisa para sua viagem em um só lugar."
    />

    <!-- Neutral, unbranded OG image shared across all domains.
         Non-JS crawlers (WhatsApp, Facebook, LinkedIn) will use this image
         for every link that does NOT override og:image server-side. It is
         intentionally illustrative (no logos, no text, no institutional
         branding) so it is safe on white-label share links AND matches the
         neutral baseline title/description above. Institutional per-route
         metadata on the main site is applied via react-helmet-async. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="O seu próximo destino começa aqui 🌍" />
    <meta property="og:description" content="Tudo que você precisa para sua viagem em um só lugar." />
    <meta property="og:image" content="https://app.agentesdesonhos.com.br/og-neutral.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ilustração minimalista de viagem" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="O seu próximo destino começa aqui 🌍" />
    <meta name="twitter:description" content="Tudo que você precisa para sua viagem em um só lugar." />
    <meta name="twitter:image" content="https://app.agentesdesonhos.com.br/og-neutral.png" />

    <!-- PWA / Instalação na tela inicial: injetado dinamicamente apenas nos domínios das carteiras digitais públicas (ver src/main.tsx) -->
  </head>

  <body translate="no" class="notranslate">
    <div id="root" translate="no" class="notranslate"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
